<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <title>FireCats — Crew Availability</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <div class="header-inner">
      <h1>FireCats</h1>
      <p id="season-info" class="season-label"></p>
    </div>
  </header>

  <main>
    <div id="calendar"></div>
  </main>

  <!-- Sign-Up Modal -->
  <div id="signup-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-box">
      <h2 id="modal-title"></h2>
      <input
        type="text"
        id="name-input"
        placeholder="Your name"
        maxlength="50"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="words"
        spellcheck="false"
      >
      <p id="modal-error" class="modal-error" role="alert"></p>
      <div class="modal-actions">
        <button id="modal-cancel"  class="btn btn-secondary">Cancel</button>
        <button id="modal-confirm" class="btn btn-primary">Sign Up</button>
      </div>
    </div>
  </div>

  <!-- Remove Confirmation Modal -->
  <div id="remove-modal" class="modal-overlay" role="dialog" aria-modal="true">
    <div class="modal-box">
      <p id="remove-msg"></p>
      <div class="modal-actions">
        <button id="remove-cancel"  class="btn btn-secondary">Cancel</button>
        <button id="remove-confirm" class="btn btn-danger">Remove</button>
      </div>
    </div>
  </div>

  <!-- Toast notification -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="calendar.js"></script>
</body>
</html>
